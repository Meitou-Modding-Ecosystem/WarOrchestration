# Publishes ExampleMod from beta as GitHub prereleases on every merge, so each upstream Meitou build the engine moves to (engine-update.yml)
# has a matching mod build to play: war-orchestration-<version>-beta.<commit> (never moved) and rolling war-orchestration-beta (ExampleMod-beta.zip).
# Packaging: GutenStructure package-meitou-mod.yml, pinned to a commit that packs items/ and imported models.
name: Beta prerelease

on:
  push:
    branches: [beta]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@5dc76952e11014b8c75699f474734c4e444eb5ea
    with:
      mod-folder: ExampleMod
      slug: war-orchestration
      channel: beta
      test-project: .
      empty-data-mod: true
