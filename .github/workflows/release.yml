# Releases the mod: every push to release reads the version from its meitou.json and, unless the tag <slug>-v<version> exists,
# creates that tag at the release head and publishes <MOD_FOLDER>-<version>.zip (with its SHA-256) holding the folder to drop into
# Kenshi/mods/, all in one run. A hand-pushed tag does the same as a fallback. Packaging: GutenStructure package-meitou-mod.yml (pinned). Rename ExampleMod / war-orchestration below with the mod (README "Use this template").
name: Release

on:
  push:
    branches: [release]
    tags: ["war-orchestration-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@5dc76952e11014b8c75699f474734c4e444eb5ea

  release:
    needs: release-gate
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@5dc76952e11014b8c75699f474734c4e444eb5ea
    with:
      mod-folder: ExampleMod
      slug: war-orchestration
      channel: release
      test-project: .
      # true for a code mod without data: the zip gets an empty ExampleMod.mod. false when <Mod>.Data generates one.
      empty-data-mod: true
